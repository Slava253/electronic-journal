<!DOCTYPE html>
<html lang="ru">
<head>

        }
        .status-bar {

        .grade-hint {

</head>

    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",

<script type="module">
import { initializeApp } from "firebase/app";
import { getDatabase, ref, set, get, child, onValue } from "firebase/database";

// ===== КОНФИГУРАЦИЯ FIREBASE =====
const firebaseConfig = {
    apiKey: "AIzaSyBfoIEyhvlUfIgAvXJwOthT6uzfB4gV0Uo",
    authDomain: "electronic-journal-5dff1.firebaseapp.com",
    databaseURL: "https://electronic-journal-5dff1-default-rtdb.firebaseio.com",
    projectId: "electronic-journal-5dff1",
    storageBucket: "electronic-journal-5dff1.firebasestorage.app",
    messagingSenderId: "293962922085",
    appId: "1:293962922085:web:391c3e453bb2725e392e8c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
console.log('✅ Firebase подключен!');

// ===== ВСЕ УЧЕНИКИ (АЛФАВИТ) =====
const rawStudents = [
    "Абросимов Олег", "Борисова Анна", "Васильев Дмитрий", "Григорьев Максим",
    "Дмитриева София", "Егоров Иван", "Жукова Екатерина", "Зайцев Алексей",
    "Иванова Мария", "Козлов Сергей", "Лебедева Варвара", "Морозова Елизавета",
    "Новиков Даниил", "Орлова Наталья", "Петров Иван", "Романова Ольга",
    "Соколова Полина", "Тарасов Глеб", "Устинова Анастасия", "Федоров Артём",
    "Харитонов Денис", "Цветкова Алина", "Чернов Владимир", "Шестакова Ксения",
    "Щукин Павел", "Яковлева Яна"
];

const students = rawStudents.sort((a,b) => {
    return a.split(' ')[0].localeCompare(b.split(' ')[0]);
}).map((name, idx) => ({ id: idx, name }));

const subjects = ["Математика", "Русский язык", "Физика", "История", "Литература"];

// ===== СОСТОЯНИЕ =====
let journal = {};
let currentSubject = "Математика";
let currentDate = "";
let currentMode = "teacher";
let selectedStudent = 0;
let isSaving = false;
let isLoaded = false;

// Текущая оценка для комментария
let currentCommentStudentId = null;
let currentCommentGradeIdx = null;

// ===== ФУНКЦИИ =====
function showNotification(text, isError = false) {
    const el = document.getElementById('notif');
    const textEl = document.getElementById('notifText');
    textEl.textContent = text;
    el.className = 'notification show ' + (isError ? 'error' : 'success');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
}

function ensureDateExists(subject, date) {
    if (!journal[subject]) journal[subject] = {};
    if (!journal[subject][date]) {
        journal[subject][date] = {};
        students.forEach(s => {
            journal[subject][date][s.id] = {
                taskName: "",
                taskType: "",
                grades: [],
                cdzChecked: false,
                cdzGrade: "",
                comments: {} // { "0": "комментарий", "1": "комментарий" }
            };
        });
        return true;
    }
    return false;
}

function getEntry(studentId) {
    ensureDateExists(currentSubject, currentDate);
    if (!journal[currentSubject][currentDate][studentId]) {
        journal[currentSubject][currentDate][studentId] = {
            taskName: "",
            taskType: "",
            grades: [],
            cdzChecked: false,
            cdzGrade: "",
            comments: {}
        };
    }
    if (!journal[currentSubject][currentDate][studentId].comments) {
        journal[currentSubject][currentDate][studentId].comments = {};
    }
    return journal[currentSubject][currentDate][studentId];
}

async function saveToFirebase(showNotif = true) {
    if (isSaving) return;
    isSaving = true;
    try {
        await set(ref(db, 'journalData'), journal);
        if (showNotif) showNotification('✅ Сохранено в Firebase!');
        console.log('✅ Данные сохранены в Firebase');
    } catch (e) {
        console.error('❌ Ошибка сохранения:', e);
        if (showNotif) showNotification('❌ Ошибка сохранения', true);
    }
    isSaving = false;
}

async function loadFromFirebase() {
    try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, 'journalData'));
        if (snapshot.exists()) {
            journal = snapshot.val();
            subjects.forEach(sub => {
                if (!journal[sub]) journal[sub] = {};
                Object.keys(journal[sub]).forEach(date => {
                    Object.keys(journal[sub][date]).forEach(id => {
                        if (!journal[sub][date][id].cdzGrade) {
                            journal[sub][date][id].cdzGrade = "";
                        }
                        if (!journal[sub][date][id].comments) {
                            journal[sub][date][id].comments = {};
                        }
                    });
                });
            });
            console.log('✅ Данные загружены из Firebase');
            return true;
        }
        console.log('ℹ️ В Firebase нет данных');
        return false;
    } catch (e) {
        console.error('❌ Ошибка загрузки:', e);
        return false;
    }
}

function initDB() {
    subjects.forEach(sub => {
        journal[sub] = {};
        const today = new Date();
        for (let i = -3; i <= 3; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() + i);
            const dateStr = d.toISOString().split('T')[0];
            journal[sub][dateStr] = {};
            students.forEach(s => {
                journal[sub][dateStr][s.id] = {
                    taskName: "",
                    taskType: "",
                    grades: [],
                    cdzChecked: false,
                    cdzGrade: "",
                    comments: {}
                };
            });
        }
    });

    const today = new Date().toISOString().split('T')[0];
    const math = journal["Математика"][today];
    if (math) {
        if (math[0]) { math[0].taskName = "Алгебра №345-350"; math[0].taskType = "homework"; math[0].grades = ["5","4"]; math[0].comments = { "0": "Отлично! Решил все уравнения верно.", "1": "Хорошо, но есть небольшие ошибки." }; }
        if (math[1]) { math[1].taskName = "ЦДЗ: Квадратные уравнения"; math[1].taskType = "cdz"; math[1].grades = ["4"]; math[1].cdzChecked = true; math[1].cdzGrade = "4"; math[1].comments = { "0": "ЦДЗ выполнено с одной ошибкой." }; }
        if (math[2]) { math[2].taskName = "Индивидуальная работа"; math[2].taskType = "individual"; math[2].grades = ["5","5"]; math[2].comments = { "0": "Отличная работа!", "1": "Дополнительно решил сложную задачу." }; }
    }
    console.log('✅ База данных инициализирована');
    saveToFirebase(false);
}

// ===== МОДАЛЬНОЕ ОКНО =====
function showGradeDetails(studentId, gradeIdx) {
    const entry = getEntry(studentId);
    const grade = entry.grades[gradeIdx];
    if (!grade) return;

    const student = students.find(s => s.id === studentId);
    const modal = document.getElementById('gradeModal');
    
    currentCommentStudentId = studentId;
    currentCommentGradeIdx = gradeIdx;
    
    document.getElementById('modalGradeValue').textContent = grade === 'нб' ? 'н/б' : grade;
    document.getElementById('modalSubject').textContent = getSubjectEmoji(currentSubject) + ' ' + currentSubject;
    document.getElementById('modalTaskName').textContent = entry.taskName || '—';
    
    const typeMap = {
        'homework': '📘 Домашнее задание',
        'cdz': '💻 Цифровое ДЗ (ЦДЗ)',
        'individual': '👤 Индивидуальное задание'
    };
    document.getElementById('modalTaskType').textContent = typeMap[entry.taskType] || '—';
    
    const parts = currentDate.split('-');
    document.getElementById('modalDate').textContent = `${parts[2]}.${parts[1]}.${parts[0]}`;
    document.getElementById('modalStudent').textContent = student ? student.name : '—';
    
    const cdzRow = document.getElementById('modalCdzRow');
    if (entry.taskType === 'cdz') {
        cdzRow.style.display = 'flex';
        document.getElementById('modalCdzStatus').textContent = entry.cdzChecked ? 
            (entry.cdzGrade ? `✅ Проверено (оценка: ${entry.cdzGrade})` : '✅ Проверено (без оценки)') : 
            '⏳ Ожидает проверки';
    } else {
        cdzRow.style.display = 'none';
    }
    
    // Комментарий
    const comment = entry.comments ? entry.comments[gradeIdx] : null;
    const displayEl = document.getElementById('modalCommentDisplay');
    const inputEl = document.getElementById('modalCommentInput');
    
    if (comment) {
        displayEl.textContent = comment;
        displayEl.style.color = '#1e293b';
        displayEl.style.fontStyle = 'normal';
        inputEl.value = comment;
    } else {
        displayEl.textContent = '—';
        displayEl.style.color = '#64748b';
        displayEl.style.fontStyle = 'italic';
        inputEl.value = '';
    }
    
    modal.classList.add('show');
}

function closeModal() {
    document.getElementById('gradeModal').classList.remove('show');
}

function saveComment() {
    if (currentCommentStudentId === null || currentCommentGradeIdx === null) return;
    
    const entry = getEntry(currentCommentStudentId);
    const comment = document.getElementById('modalCommentInput').value.trim();
    
    if (!entry.comments) entry.comments = {};
    entry.comments[currentCommentGradeIdx] = comment || '';
    
    saveToFirebase(false);
    render();
    showNotification('✅ Комментарий сохранён!');
}

function getSubjectEmoji(subject) {
    const map = {
        'Математика': '📐',
        'Русский язык': '📖',
        'Физика': '⚛️',
        'История': '🏛️',
        'Литература': '📚'
    };
    return map[subject] || '📚';
}

// ===== РЕНДЕР =====
function render() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    const isTeacher = currentMode === 'teacher';
    const filtered = isTeacher ? students : students.filter(s => s.id === selectedStudent);

    let total = 0, sum = 0;

    filtered.forEach(student => {
        const entry = getEntry(student.id);
        const tr = document.createElement('tr');

        // Имя
        const tdName = document.createElement('td');
        tdName.className = 'student-name';
        tdName.innerHTML = `<i class="fas fa-user-graduate"></i> ${student.name}`;
        tr.appendChild(tdName);

        // Задание
        const tdTask = document.createElement('td');
        if (isTeacher) {
            const inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'task-input';
            inp.placeholder = 'Название задания...';
            inp.value = entry.taskName || '';
            inp.onchange = () => {
                entry.taskName = inp.value;
                saveToFirebase(false);
            };
            tdTask.appendChild(inp);
        } else {
            tdTask.textContent = entry.taskName || '—';
        }
        tr.appendChild(tdTask);

        // Тип
        const tdType = document.createElement('td');
        if (isTeacher) {
            const sel = document.createElement('select');
            sel.style.cssText = 'padding:4px 10px;border-radius:30px;border:1px solid #cbd5e1;background:#fefce8;font-family:inherit;font-size:0.75rem;';
            const types = [
                {val:'', label:'— выберите —'},
                {val:'homework', label:'📘 Домашнее задание'},
                {val:'cdz', label:'💻 ЦДЗ'},
                {val:'individual', label:'👤 Индивидуальное'}
            ];
            types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.val;
                opt.textContent = t.label;
                if (entry.taskType === t.val) opt.selected = true;
                sel.appendChild(opt);
            });
            sel.onchange = () => {
                entry.taskType = sel.value;
                if (entry.taskType !== 'cdz') {
                    entry.cdzChecked = false;
                    entry.cdzGrade = '';
                }
                saveToFirebase(false);
                render();
            };
            tdType.appendChild(sel);
        } else {
            let cls = '';
            let text = '—';
            if (entry.taskType === 'homework') { text = '📘 Д/з'; cls = 'badge-homework'; }
            else if (entry.taskType === 'cdz') { text = '💻 ЦДЗ'; cls = 'badge-cdz'; }
            else if (entry.taskType === 'individual') { text = '👤 Индив.'; cls = 'badge-individual'; }
            tdType.innerHTML = `<span class="badge ${cls}">${text}</span>`;
        }
        tr.appendChild(tdType);

        // Оценки
        const tdGrades = document.createElement('td');
        const wrap = document.createElement('div');
        wrap.className = 'grades-wrap';

        entry.grades.forEach((g, idx) => {
            const chip = document.createElement('div');
            chip.className = 'grade-chip';
            const display = g === 'нб' ? 'н/б' : g;
            
            const hasComment = entry.comments && entry.comments[idx] && entry.comments[idx].trim();
            
            if (isTeacher) {
                chip.innerHTML = `${display} ${hasComment ? '<span class="comment-badge">💬</span>' : ''} <i class="fas fa-times" data-idx="${idx}"></i>`;
                chip.querySelector('i').onclick = (e) => {
                    e.stopPropagation();
                    entry.grades.splice(idx, 1);
                    if (entry.comments && entry.comments[idx]) {
                        delete entry.comments[idx];
                    }
                    saveToFirebase(false);
                    render();
                };
                chip.onclick = () => {
                    showGradeDetails(student.id, idx);
                };
            } else {
                chip.innerHTML = `${display} ${hasComment ? '<span class="comment-badge">💬</span>' : ''}`;
                chip.classList.add('clickable');
                chip.onclick = () => {
                    showGradeDetails(student.id, idx);
                };
                chip.title = 'Нажмите для просмотра деталей';
            }
            
            wrap.appendChild(chip);
            if (g !== 'нб') {
                const num = parseInt(g);
                if (!isNaN(num) && num >= 2 && num <= 5) {
                    total++;
                    sum += num;
                }
            }
        });

        if (isTeacher) {
            const addBtn = document.createElement('button');
            addBtn.className = 'add-grade';
            addBtn.innerHTML = '<i class="fas fa-plus"></i> Оценка';
            addBtn.onclick = () => {
                const val = prompt('Введите оценку (2-5 или нб):');
                if (val !== null) {
                    const v = val.trim().toLowerCase();
                    if (v === 'нб' || (parseInt(v) >= 2 && parseInt(v) <= 5)) {
                        entry.grades.push(v);
                        saveToFirebase(false);
                        render();
                    } else {
                        alert('Оценка должна быть 2-5 или нб');
                    }
                }
            };
            wrap.appendChild(addBtn);
        } else {
            if (entry.grades.length > 0) {
                const hint = document.createElement('div');
                hint.className = 'grade-hint';
                hint.textContent = '👆 нажми на оценку для деталей';
                wrap.appendChild(hint);
            }
        }
        tdGrades.appendChild(wrap);
        tr.appendChild(tdGrades);

        // ЦДЗ
        const tdCdz = document.createElement('td');
        if (entry.taskType === 'cdz') {
            if (isTeacher) {
                const div = document.createElement('div');
                div.className = 'cdz-actions';
                if (!entry.cdzChecked) {
                    const b1 = document.createElement('button');
                    b1.className = 'cdz-btn cdz-grade';
                    b1.innerHTML = '<i class="fas fa-check"></i> + оценка';
                    b1.onclick = () => {
                        const g = prompt('Введите оценку за ЦДЗ (2-5):');
                        if (g !== null && parseInt(g) >= 2 && parseInt(g) <= 5) {
                            entry.cdzChecked = true;
                            entry.cdzGrade = g;
                            entry.grades.push(g);
                            saveToFirebase(false);
                            render();
                        }
                    };
                    div.appendChild(b1);

                    const b2 = document.createElement('button');
                    b2.className = 'cdz-btn cdz-nograde';
                    b2.innerHTML = '<i class="fas fa-eye"></i> без оценки';
                    b2.onclick = () => {
                        entry.cdzChecked = true;
                        entry.cdzGrade = '';
                        saveToFirebase(false);
                        render();
                    };
                    div.appendChild(b2);
                } else {
                    const status = document.createElement('div');
                    status.className = 'cdz-status';
                    status.innerHTML = entry.cdzGrade ? 
                        `✅ Проверено<br>Оценка: <strong>${entry.cdzGrade}</strong>` :
                        '✅ Проверено<br><span style="font-size:0.6rem;">(без оценки)</span>';
                    div.appendChild(status);

                    const reset = document.createElement('button');
                    reset.className = 'cdz-btn';
                    reset.style.cssText = 'background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;';
                    reset.innerHTML = '<i class="fas fa-undo"></i> Сброс';
                    reset.onclick = () => {
                        if (confirm('Сбросить проверку?')) {
                            entry.cdzChecked = false;
                            if (entry.cdzGrade) {
                                const idx = entry.grades.indexOf(entry.cdzGrade);
                                if (idx !== -1) entry.grades.splice(idx, 1);
                                entry.cdzGrade = '';
                            }
                            saveToFirebase(false);
                            render();
                        }
                    };
                    div.appendChild(reset);
                }
                tdCdz.appendChild(div);
            } else {
                tdCdz.innerHTML = entry.cdzChecked ? 
                    (entry.cdzGrade ? `✅ ${entry.cdzGrade}` : '✅ проверено') : 
                    '⏳ ожидает';
            }
        } else {
            tdCdz.textContent = '—';
        }
        tr.appendChild(tdCdz);
        tbody.appendChild(tr);
    });

    document.getElementById('totalGrades').textContent = total;
    document.getElementById('avgGrade').textContent = total === 0 ? '—' : (sum / total).toFixed(2);
}

// ===== НАВИГАЦИЯ =====
function setDate(date) {
    currentDate = date;
    document.getElementById('datePicker').value = date;
    const parts = date.split('-');
    document.getElementById('dateDisplay').textContent = `${parts[2]}.${parts[1]}.${parts[0]}`;
    ensureDateExists(currentSubject, currentDate);
    if (isLoaded) render();
}

function changeDate(delta) {
    const d = new Date(currentDate);
    d.setDate(d.getDate() + delta);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    setDate(`${y}-${m}-${day}`);
}

// ===== ЗАПУСК =====
async function init() {
    console.log('🚀 Запуск приложения...');
    
    const hasData = await loadFromFirebase();
    if (!hasData) {
        initDB();
    }

    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth()+1).padStart(2,'0');
    const d = String(today.getDate()).padStart(2,'0');
    currentDate = `${y}-${m}-${d}`;
    document.getElementById('datePicker').value = currentDate;
    document.getElementById('dateDisplay').textContent = `${d}.${m}.${y}`;
    
    ensureDateExists(currentSubject, currentDate);

    const sel = document.getElementById('studentSelect');
    students.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        sel.appendChild(opt);
    });
    sel.onchange = () => {
        selectedStudent = parseInt(sel.value);
        if (currentMode === 'student') render();
    };

    // Подписка на изменения в Firebase
    const journalRef = ref(db, 'journalData');
    onValue(journalRef, (snapshot) => {
        if (snapshot.exists() && isLoaded) {
            const newData = snapshot.val();
            if (JSON.stringify(journal) !== JSON.stringify(newData)) {
                journal = newData;
                console.log('🔄 Данные обновлены из Firebase');
                render();
            }
        }
    });

    // События
    document.getElementById('subjectSelect').onchange = (e) => {
        currentSubject = e.target.value;
        ensureDateExists(currentSubject, currentDate);
        render();
    };

    document.getElementById('datePicker').onchange = (e) => setDate(e.target.value);
    document.getElementById('prevDate').onclick = () => changeDate(-1);
    document.getElementById('nextDate').onclick = () => changeDate(1);

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            const picker = document.getElementById('studentPicker');
            if (currentMode === 'teacher') {
                picker.style.opacity = '0.5';
                picker.style.pointerEvents = 'none';
            } else {
                picker.style.opacity = '1';
                picker.style.pointerEvents = 'auto';
            }
            render();
        };
    });

    document.getElementById('saveBtn').onclick = () => saveToFirebase(true);
    document.getElementById('resetBtn').onclick = () => {
        if (confirm(`Очистить всё на ${currentDate} по ${currentSubject}?`)) {
            students.forEach(s => {
                const e = getEntry(s.id);
                e.taskName = '';
                e.taskType = '';
                e.grades = [];
                e.cdzChecked = false;
                e.cdzGrade = '';
                e.comments = {};
            });
            saveToFirebase(false);
            render();
            showNotification('Очищено!');
        }
    };

    // Модальное окно
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('gradeModal').onclick = (e) => {
        if (e.target === e.currentTarget) closeModal();
    };
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    document.getElementById('modalSaveComment').onclick = saveComment;

    isLoaded = true;
    render();
    showNotification('✅ Загружено из Firebase!');
    console.log('✅ Приложение запущено успешно!');
}

init().catch(err => {
    console.error('❌ Ошибка при запуске:', err);
    showNotification('❌ Ошибка подключения к Firebase', true);
});
</script>
</body>
</html>
